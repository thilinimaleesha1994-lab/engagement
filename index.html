<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sameera & Maleesha - Engagement Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Poppins', sans-serif;
background-color: #0b0f19;
color: #fff;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow-x: hidden;
position: relative;
}

/* Background with Couple Image & Overlay */
.bg-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: url('couple.jpg') no-repeat center center/cover;
filter: brightness(0.4) contrast(1.1);
z-index: -2;
transform: scale(1.05);
animation: slowZoom 20s infinite alternate;
}

@keyframes slowZoom {
0% { transform: scale(1); }
100% { transform: scale(1.1); }
}

.gradient-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(135deg, rgba(11, 15, 25, 0.85), rgba(74, 20, 40, 0.75)),
radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 90%);
z-index: -1;
}

/* Floating Petals / Particles Container */
#particles-js {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
pointer-events: none;
}

/* Main Card Container */
.container {
position: relative;
z-index: 2;
width: 90%;
max-width: 450px;
background: rgba(255, 255, 255, 0.08);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.2);
border-radius: 24px;
padding: 35px 25px;
text-align: center;
box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
0 0 30px rgba(184, 134, 11, 0.2);
margin: 20px 0;
animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

/* Header Elements */
.bismillah {
font-family: 'Cinzel', serif;
font-size: 0.9rem;
letter-spacing: 3px;
color: #e6c687;
margin-bottom: 15px;
text-transform: uppercase;
}

.invitation-text {
font-size: 0.95rem;
letter-spacing: 1px;
color: #ddd;
margin-bottom: 10px;
font-weight: 300;
}

.guest-box {
background: rgba(184, 134, 11, 0.15);
border: 1px dashed rgba(184, 134, 11, 0.5);
padding: 10px 15px;
border
